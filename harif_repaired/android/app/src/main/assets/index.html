  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    color:var(--text);font-family:var(--font);min-height:100vh;
    background-image:linear-gradient(180deg, rgba(6,10,20,.88), rgba(6,10,20,.93)), var(--bg-image);
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;
    background-color:var(--ink);
  }
  @media (max-width:700px){
    body{background-attachment:scroll;}
  }
  button,input,textarea{font-family:inherit;}
  #app{min-height:100vh;padding:28px 18px 70px;}

  /* ---------- shared bits ---------- */
  .btn{cursor:pointer;border:none;border-radius:6px;font-weight:700;padding:12px 18px;font-size:15px;transition:transform .08s ease,background .15s ease,color .15s ease;}
  .btn:active{transform:scale(.97);}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .btn-primary{background:var(--accent);color:#04211d;}
  .btn-primary:hover{background:var(--accent-2);color:#fff;}
  .btn-block{width:100%;}
  .btn-ghost{background:transparent;color:var(--text);border:1px solid var(--line);padding:8px 14px;font-size:13.5px;}
  .btn-ghost:hover{border-color:var(--accent);color:var(--accent);}
  .btn-sm{padding:7px 13px;font-size:13px;}
  .btn-danger{background:var(--tie);color:#2b0b06;}
  .btn-danger:hover{background:#ff8a6e;}

  /* ---------- brand header ---------- */
  .brand{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;margin:0 auto 24px;}
  .brand-logo{height:58px;width:auto;max-width:86vw;}
  .brand-sm .brand-logo{height:42px;}
  .brand-teacher{color:var(--accent);font-weight:700;font-size:13px;letter-spacing:.2px;}

  /* ---------- dashboard screen ---------- */
  .dashboard-screen{max-width:1100px;margin:10px auto 0;}
  .dashboard-actions{display:flex;justify-content:center;margin-bottom:28px;}
  .dashboard-empty{max-width:460px;margin:20px auto;text-align:center;color:var(--muted);line-height:1.8;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:30px;}
  .dashboard-empty p{margin:0 0 8px;}
  .dashboard-empty-sub{font-size:13px;}
  .tournament-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;}
  .tournament-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px;}
  .tc-name{font-weight:800;font-size:16px;}
  .tc-class{color:var(--accent);font-size:12.5px;font-weight:700;margin-top:2px;}
  .tc-meta{color:var(--muted);font-size:12.5px;}
  .tc-progress{font-size:13px;font-weight:700;color:var(--text);}
  .tc-progress-done{color:var(--gold);}
  .tc-actions{display:flex;gap:8px;margin-top:4px;}
  .tc-actions .tc-open{flex:1;}
  .tc-confirm{display:flex;flex-direction:column;gap:8px;background:rgba(242,114,90,.1);border:1px solid var(--tie);border-radius:8px;padding:10px;font-size:12.5px;color:#ffb3a1;text-align:center;}
  .tc-confirm-btns{display:flex;gap:8px;}
  .tc-confirm-btns .btn{flex:1;}

  /* ---------- setup screen ---------- */
  .setup-screen{max-width:560px;margin:20px auto;}
  .setup-back{margin-bottom:16px;}
  .setup-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:32px;box-shadow:0 20px 60px -20px rgba(45,212,191,.25);}
  .setup-badge{display:inline-block;background:var(--panel-2);color:var(--accent);padding:6px 14px;border-radius:999px;font-weight:700;font-size:13px;}
  .setup-card h1{font-size:26px;font-weight:900;margin:14px 0 8px;}
  .setup-sub{color:var(--muted);line-height:1.7;margin:0 0 26px;font-size:14.5px;max-width:56ch;}
  .field{display:block;margin-bottom:18px;}
  .field>span{display:block;font-weight:700;margin-bottom:6px;font-size:14px;}
  .field>small{display:block;color:var(--muted);font-size:12px;margin-bottom:6px;}
  .field input,.field textarea{width:100%;background:var(--ink);border:1px solid var(--line);border-radius:6px;padding:10px 12px;color:var(--text);font-size:15px;resize:vertical;}
  .field input:focus,.field textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent);}
  .setup-preview{margin:8px 0 18px;font-size:13.5px;color:var(--accent);font-weight:700;min-height:18px;}
  .setup-error{background:rgba(242,114,90,.12);border:1px solid var(--tie);color:#ffb3a1;padding:10px 12px;border-radius:6px;margin-bottom:16px;font-size:13.5px;}

  /* ---------- topbar ---------- */
  .topbar{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;max-width:1400px;margin:0 auto 22px;padding-bottom:16px;border-bottom:1px solid var(--line);}
  .topbar-title{display:flex;gap:12px;align-items:center;}
  .topbar-badge{font-size:30px;}
  .topbar-title h1{font-size:21px;font-weight:900;margin:0;}
  .topbar-sub{color:var(--muted);font-size:12.5px;}
  .topbar-teacher{display:block;color:var(--muted);font-size:11px;margin-top:3px;}
  .topbar-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .confirm-text{color:#ffb3a1;font-size:13px;font-weight:700;}

  /* ---------- champion banner ---------- */
  .champion-banner{position:relative;overflow:hidden;max-width:1400px;margin:0 auto 26px;background:linear-gradient(135deg,rgba(245,185,66,.18),rgba(245,185,66,.03));border:1px solid var(--gold);border-radius:12px;padding:22px 24px;display:flex;align-items:center;gap:16px;}
  .champion-trophy{font-size:40px;}
  .champion-text span{display:block;color:var(--gold);font-weight:700;font-size:13px;margin-bottom:2px;}
  .champion-text strong{display:block;font-size:24px;font-weight:900;color:#fff;}
  .confetti{position:absolute;inset:0;pointer-events:none;}
  .confetti span{position:absolute;top:-10px;width:6px;height:6px;border-radius:1px;background:var(--gold);left:calc(var(--i) * 7%);animation:confetti-fall 2.1s ease-in infinite;animation-delay:calc(var(--i) * .13s);}
  .confetti span:nth-child(odd){background:var(--accent);}
  @keyframes confetti-fall{0%{transform:translateY(-16px) rotate(0deg);opacity:1;}100%{transform:translateY(110px) rotate(280deg);opacity:0;}}
  @media (prefers-reduced-motion:reduce){.confetti span{animation:none;display:none;}}

  /* ---------- bracket ---------- */
  .bracket-scroll{overflow-x:auto;max-width:1400px;margin:0 auto;padding-bottom:10px;}
  .print-date{display:none;}
  .bracket{position:relative;display:flex;gap:56px;min-width:max-content;padding:6px 4px 18px;}
  .bracket-svg{position:absolute;top:0;left:0;pointer-events:none;z-index:0;overflow:visible;}
  .conn{fill:none;stroke:var(--line);stroke-width:2;}
  .conn-done{stroke:var(--accent);}
  .round{display:flex;flex-direction:column;min-width:212px;position:relative;z-index:1;}
  .round-label{flex:0 0 auto;text-align:center;font-weight:700;font-size:13px;color:var(--accent);margin-bottom:16px;padding-bottom:8px;border-bottom:1px dashed var(--line);}
  .round-matches{flex:1 1 auto;display:flex;flex-direction:column;justify-content:space-around;gap:18px;}

  .match{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 14px;border-inline-start:3px solid var(--line);}
  .match.is-ready{cursor:pointer;border-inline-start-color:var(--accent);}
  .match.is-ready:hover{background:var(--panel-2);border-color:var(--accent);}
  .match.is-done{border-inline-start-color:var(--gold);}
  .match.is-bye{border-inline-start-color:var(--muted);opacity:.85;}
  .match.is-pending{border-style:dashed;opacity:.6;}

  .player-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:14px;gap:8px;}
  .player-name{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1 1 auto;min-width:0;}
  .player-row.is-winner .player-name{color:var(--gold);font-weight:800;}
  .player-row.is-loser .player-name{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line);}
  .player-row.is-placeholder .player-name{color:var(--muted);font-size:12.5px;}
  .player-score{font-weight:800;font-variant-numeric:tabular-nums;min-width:18px;text-align:center;}
  .winner-mark{font-size:12px;}
  .vs-divider{height:1px;background:var(--line);margin:2px 0;}
  .match-footer{margin-top:6px;padding-top:6px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);text-align:center;}
  .match-cta{color:var(--accent);font-weight:700;}
  .undo-link{cursor:pointer;text-decoration:underline;text-decoration-style:dotted;}
  .undo-link:hover{color:var(--tie);}

  .scroll-hint{display:none;}

  /* ---------- scoring panel ---------- */
  .panel-overlay{position:fixed;inset:0;background:rgba(6,10,20,.72);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px;width:100%;max-width:480px;position:relative;box-shadow:0 30px 80px -20px rgba(0,0,0,.6);}
  .panel-close{position:absolute;top:14px;inset-inline-end:14px;background:transparent;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:4px;}
  .panel-close:hover{color:var(--tie);}
  .panel-title{font-weight:900;font-size:18px;margin-bottom:20px;text-align:center;}
  .panel-players{display:flex;gap:14px;margin-bottom:16px;}
  .panel-player{flex:1;background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:16px 10px;text-align:center;}
  .panel-player-name{font-weight:700;font-size:14.5px;margin-bottom:10px;min-height:38px;overflow-wrap:break-word;}
  .panel-score{font-size:34px;font-weight:900;color:var(--accent);font-variant-numeric:tabular-nums;margin-bottom:12px;}
  .score-plus{display:block;width:100%;background:var(--accent);color:#04211d;border:none;border-radius:6px;padding:9px 4px;font-weight:700;cursor:pointer;font-size:12.5px;margin-bottom:8px;}
  .score-plus:hover{background:var(--accent-2);color:#fff;}
  .score-minus{display:block;font-size:11.5px;color:var(--muted);text-decoration:underline;text-decoration-style:dotted;cursor:pointer;}
  .score-minus:hover{color:var(--tie);}
  .panel-status{text-align:center;font-weight:700;margin-bottom:16px;min-height:20px;font-size:14.5px;}
  .tie-break{background:rgba(242,114,90,.1);border:1px solid var(--tie);border-radius:10px;padding:14px;text-align:center;}
  .tie-break-label{font-size:12.5px;color:#ffb3a1;margin-bottom:10px;font-weight:700;line-height:1.5;}
  .tie-break-btn{display:inline-block;margin:4px;background:var(--tie);color:#2b0b06;border:none;border-radius:6px;padding:8px 14px;font-weight:700;cursor:pointer;font-size:12.5px;}
  .tie-break-btn:hover{background:#ff8a6e;}

  @media (max-width:700px){
    .bracket{gap:34px;}
    .round{min-width:168px;}
    .panel-players{flex-direction:column;}
    .topbar{flex-direction:column;align-items:stretch;}
    .topbar-actions{justify-content:flex-end;}
    .scroll-hint{display:block;text-align:center;color:var(--muted);font-size:12px;margin:6px 0 0;}
  }

  @media print{
    body{background:#fff;color:#111;}
    #app{padding:10px;}
    .topbar-actions,.setup-screen,.dashboard-screen,.match-footer .undo-link,.scroll-hint,.panel-overlay{display:none !important;}
    .bracket-svg{display:none;}
    .bracket-scroll{overflow:visible;}
    .bracket{gap:22px;}
    .topbar{border-color:#999;}
    .topbar-title h1{color:#111;}
    .topbar-sub{color:#444;}
    .topbar-teacher{color:#444;}
    .round-label{color:#111;}
    .match{background:#fff;border:1px solid #333;}
    .match.is-pending{border-style:dashed;}
    .player-row.is-winner .player-name{color:#111;font-weight:900;}
    .player-row.is-loser .player-name{color:#777;}
    .champion-banner{background:#fff;border:2px solid #111;}
    .champion-text strong{color:#111;}
    .print-date{display:block;text-align:center;color:#555;font-size:11.5px;margin-bottom:14px;}
    @page{size:landscape;margin:12mm;}
  }
</style>
</head>

  var TEACHER_NAME = "أ. محمد السيد عبد المولى — مدرس العلوم";
  var INDEX_KEY = 'harif-index-v1';
  var LEGACY_KEY = 'harif-tournament-v1';
  var app = document.getElementById('app');

  var view = 'dashboard';   // 'dashboard' | 'setup' | 'tournament'
  var currentId = null;
  var state = null;

  /* ---------------- helpers ---------------- */
  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function shuffle(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var tmp=a[i]; a[i]=a[j]; a[j]=tmp;
    }
    return a;
  }
  function nextPow2(n){ var s=1; while(s<n) s*=2; return s; }
  function genId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

  /* ---------------- storage: multi-tournament ---------------- */
  function tournamentKey(id){ return 'harif-t-' + id; }

  function loadIndex(){
    try{
      var raw = localStorage.getItem(INDEX_KEY);
      return raw ? JSON.parse(raw) : [];
    }catch(e){ return []; }
  }
  function saveIndex(idx){
    try{ localStorage.setItem(INDEX_KEY, JSON.stringify(idx)); }catch(e){}
  }
  function loadTournamentData(id){
    try{
      var raw = localStorage.getItem(tournamentKey(id));
      return raw ? JSON.parse(raw) : null;
    }catch(e){ return null; }
  }
  function saveState(){
    if(!currentId) return;
    try{ localStorage.setItem(tournamentKey(currentId), JSON.stringify(state)); }catch(e){ console.error('save failed', e); }
  }
  function migrateLegacyIfNeeded(){
    try{
      var idx = loadIndex();
      var old = localStorage.getItem(LEGACY_KEY);
      if(old && idx.length===0){
        var data = JSON.parse(old);
        var id = genId();
        data.id = id;
        localStorage.setItem(tournamentKey(id), JSON.stringify(data));
        idx.push({id:id, tournamentName:data.tournamentName, classLabel:data.classLabel, createdAt:data.createdAt});
        saveIndex(idx);
        localStorage.removeItem(LEGACY_KEY);
      }
    }catch(e){ /* ignore */ }
  }

  /* ---------------- tournament logic ---------------- */
  function createTournament(names, tournamentName, classLabel){
    var n = names.length;
    var size = nextPow2(n);
    var combined = shuffle(names.concat(Array(size-n).fill(null)));
    var round0 = [];
    for(var i=0;i<combined.length;i+=2){
      var p1 = combined[i], p2 = combined[i+1];
      var match = {p1: p1?{name:p1}:null, p2: p2?{name:p2}:null, score1:0, score2:0, winner:null, bye:false};
      if(p1 && !p2){ match.winner='p1'; match.bye=true; }
      else if(p2 && !p1){ match.winner='p2'; match.bye=true; }
      round0.push(match);
    }
    var rounds = [round0];
    var count = round0.length;
    while(count>1){
      count = count/2;
      var rm=[];
      for(var k=0;k<count;k++) rm.push({p1:null,p2:null,score1:0,score2:0,winner:null,bye:false});
      rounds.push(rm);
    }
    for(var idx=0; idx<round0.length; idx++){
      if(round0[idx].winner){
        var w = round0[idx].winner==='p1' ? round0[idx].p1 : round0[idx].p2;
        var nextIdx = Math.floor(idx/2), slot = idx%2===0 ? 'p1':'p2';
        if(rounds[1]) rounds[1][nextIdx][slot] = w;
      }
    }
    return {tournamentName:tournamentName, classLabel:classLabel, createdAt:new Date().toISOString(), rounds:rounds};
  }

  function finishMatch(r,m,winnerKey){
    var match = state.rounds[r][m];
    match.winner = winnerKey;
    if(r+1 < state.rounds.length){
      var w = winnerKey==='p1' ? match.p1 : match.p2;
      var nextIdx = Math.floor(m/2), slot = m%2===0 ? 'p1':'p2';
      state.rounds[r+1][nextIdx][slot] = w;
    }
  }
  function clearDownstream(r,m){
    if(r+1 >= state.rounds.length) return;
    var nextIdx = Math.floor(m/2), slot = m%2===0 ? 'p1':'p2';
    var nm = state.rounds[r+1][nextIdx];
    if(!nm) return;
    nm[slot] = null;
    if(nm.winner){
      nm.winner=null; nm.score1=0; nm.score2=0;
      clearDownstream(r+1, nextIdx);
    }
  }
  function undoMatch(r,m){
    var match = state.rounds[r][m];
    if(match.bye) return;
    match.winner=null; match.score1=0; match.score2=0;
    clearDownstream(r,m);
  }
  function roundLabel(matchesCount){
    if(matchesCount===1) return 'النهائي';
    if(matchesCount===2) return 'نصف النهائي';
    if(matchesCount===4) return 'ربع النهائي';
    return 'دور الـ' + (matchesCount*2);
  }
  function champion(){
    var last = state.rounds[state.rounds.length-1][0];
    if(last && last.winner) return last.winner==='p1' ? last.p1.name : last.p2.name;
    return null;
  }
  function summarize(data){
    var studentsSet = {};
    data.rounds[0].forEach(function(m){
      if(m.p1) studentsSet[m.p1.name] = true;
      if(m.p2) studentsSet[m.p2.name] = true;
    });
    var total=0, played=0;
    data.rounds.forEach(function(round){
      round.forEach(function(m){
        if(m.bye) return;
        total++;
        if(m.winner) played++;
      });
    });
    var champ = null;
    var last = data.rounds[data.rounds.length-1][0];
    if(last && last.winner) champ = last.winner==='p1' ? last.p1.name : last.p2.name;
    return {studentsCount:Object.keys(studentsSet).length, total:total, played:played, champion:champ};
  }

  /* ---------------- navigation ---------------- */
  function goToDashboard(){
    state=null; currentId=null; openMatchRef=null; confirmingReset=false;
    view='dashboard'; render();
  }
  function goToSetup(){
    draftNames=''; draftTournamentName='دوري الحريف'; draftClassLabel=''; setupError='';
    view='setup'; render();
  }
  function openTournament(id){
    var data = loadTournamentData(id);
    if(!data) return;
    state=data; currentId=id; openMatchRef=null; confirmingReset=false;
    view='tournament'; render();
  }
  function deleteTournamentById(id){
    var idx = loadIndex().filter(function(e){ return e.id!==id; });
    saveIndex(idx);
    try{ localStorage.removeItem(tournamentKey(id)); }catch(e){}
    confirmingDeleteId=null;
    if(currentId===id){
      state=null; currentId=null; confirmingReset=false; view='dashboard';
    }
    render();
  }

  /* ---------------- render: root ---------------- */
  function render(){
    app.innerHTML = '';
    if(view==='setup') renderSetup();
    else if(view==='tournament' && state) renderTournament();
    else renderDashboard();
  }

  function renderBrand(big){
    var div = document.createElement('div');
    div.className = big ? 'brand brand-lg' : 'brand brand-sm';
    div.innerHTML =
      '<img src="'+LOGO_URI+'" alt="دوري الحريف" class="brand-logo">' +
      '<div class="brand-teacher">'+escapeHtml(TEACHER_NAME)+'</div>';
    return div;
  }

  /* ---------------- render: dashboard ---------------- */
  function renderDashboard(){
    var wrap = document.createElement('div');
    wrap.className = 'dashboard-screen';
    wrap.appendChild(renderBrand(true));

    var actionsRow = document.createElement('div');
    actionsRow.className = 'dashboard-actions';
    actionsRow.innerHTML = '<button id="new-tournament-dash-btn" class="btn btn-primary">+ بطولة جديدة</button>';
    wrap.appendChild(actionsRow);

    var idx = loadIndex().slice().sort(function(a,b){
      return new Date(b.createdAt) - new Date(a.createdAt);
    });

    if(idx.length===0){
      var empty = document.createElement('div');
      empty.className = 'dashboard-empty';
      empty.innerHTML =
        '<p>لسه مفيش أي بطولة محفوظة.</p>' +
        '<p class="dashboard-empty-sub">اعمل أول بطولة عشان تبدأ. تقدر تحتفظ بأكتر من بطولة في نفس الوقت — مثلاً بطولة لكل صف — وكل واحدة بتحفظ أسامي طلابها وتقدمها لوحدها.</p>';
      wrap.appendChild(empty);
    } else {
      var grid = document.createElement('div');
      grid.className = 'tournament-grid';
      idx.forEach(function(entry){
        var data = loadTournamentData(entry.id);
        if(!data) return;
        var sum = summarize(data);
        var card = document.createElement('div');
        card.className = 'tournament-card';
        var progressText = sum.champion ? ('🏆 البطل: '+escapeHtml(sum.champion)) : (sum.played+' / '+sum.total+' مباريات اتلعبت');
        var bodyHtml =
          '<div class="tc-top">' +
            '<div class="tc-name">'+escapeHtml(data.tournamentName)+'</div>' +
            (data.classLabel ? '<div class="tc-class">'+escapeHtml(data.classLabel)+'</div>' : '') +
          '</div>' +
          '<div class="tc-meta">👥 '+sum.studentsCount+' طالب</div>' +
          '<div class="tc-progress'+(sum.champion?' tc-progress-done':'')+'">'+progressText+'</div>';
        if(confirmingDeleteId===entry.id){
          bodyHtml +=
            '<div class="tc-confirm">' +
              '<span>حذف البطولة دي نهائي؟</span>' +
              '<div class="tc-confirm-btns">' +
                '<button class="btn btn-danger btn-sm tc-delete-yes" data-id="'+entry.id+'">تأكيد</button>' +
                '<button class="btn btn-ghost btn-sm tc-delete-no">إلغاء</button>' +
              '</div>' +
            '</div>';
        } else {
          bodyHtml +=
            '<div class="tc-actions">' +
              '<button class="btn btn-primary btn-sm tc-open" data-id="'+entry.id+'">فتح ومتابعة ↩</button>' +
              '<button class="btn btn-ghost btn-sm tc-delete" data-id="'+entry.id+'" aria-label="حذف البطولة">🗑️</button>' +
            '</div>';
        }
        card.innerHTML = bodyHtml;
        grid.appendChild(card);
      });
      wrap.appendChild(grid);
    }
    app.appendChild(wrap);
  }

  /* ---------------- render: setup ---------------- */
  function renderSetup(){
    var div = document.createElement('div');
    div.className = 'setup-screen';
    div.appendChild(renderBrand(false));
    var card = document.createElement('div');
    card.className = 'setup-card';
    card.innerHTML =
      '<button id="back-to-dashboard-btn" class="btn btn-ghost btn-sm setup-back">→ رجوع لكل البطولات</button>' +
      '<span class="setup-badge">⚗️ بطولة جديدة</span>' +
      '<h1>سجّل بطولة علوم جديدة</h1>' +
      '<p class="setup-sub">اكتب أسماء الطلاب، وهنعمل لهم قرعة عشوائية بنظام خروج المغلوب — زي الشامبيونز ليج بالظبط، بس بالأسئلة العلمية. تقدر تعمل بطولة لكل صف، وكل بطولة هتتحفظ لوحدها.</p>' +
      '<label class="field"><span>اسم البطولة</span>' +
        '<input type="text" id="tournament-name-input" maxlength="40" value="'+escapeHtml(draftTournamentName)+'">' +
      '</label>' +
      '<label class="field"><span>اسم الصف أو المجموعة (اختياري)</span>' +
        '<input type="text" id="class-label-input" maxlength="60" placeholder="مثلاً: الصف الرابع الابتدائي" value="'+escapeHtml(draftClassLabel)+'">' +
      '</label>' +
      '<label class="field"><span>أسماء الطلاب</span><small>اكتب اسم كل طالب في سطر لوحده</small>' +
        '<textarea id="names-textarea" rows="10" placeholder="أحمد سمير&#10;مريم عادل&#10;يوسف خالد">'+escapeHtml(draftNames)+'</textarea>' +
      '</label>' +
      '<div id="setup-preview" class="setup-preview"></div>' +
      (setupError ? '<div class="setup-error">'+escapeHtml(setupError)+'</div>' : '') +
      '<button id="start-tournament-btn" class="btn btn-primary btn-block">قرعة البطولة 🎲</button>';
    div.appendChild(card);
    app.appendChild(div);
    updateSetupPreview();
  }

  function updateSetupPreview(){
    var el = document.getElementById('setup-preview');
    if(!el) return;
    var names = draftNames.split('\n').map(function(s){return s.trim();}).filter(Boolean);
    var count = names.length;
    if(count===0){ el.textContent = '📋 لسه ما كتبتش أسامي'; return; }
    if(count===1){ el.textContent = '📋 طالب واحد بس — محتاج واحد كمان على الأقل'; return; }
    var size = nextPow2(count);
    var byes = size - count;
    var txt = '📋 ' + count + ' طالب — هيتكون دور أول فيه ' + (size/2) + ' مباراة';
    if(byes>0) txt += ' (مع راحة تلقائية لـ ' + byes + ' طالب بالقرعة)';
    el.textContent = txt;
  }

  function handleStartTournament(){
    var names = draftNames.split('\n').map(function(s){return s.trim();}).filter(Boolean);
    if(names.length < 2){ setupError='لازم على الأقل طالبين اتنين عشان تبدأ البطولة.'; render(); return; }
    if(names.length > 64){ setupError='أقصى عدد للطلاب في البطولة الواحدة هو 64 طالب.'; render(); return; }
    var tname = (document.getElementById('tournament-name-input').value || '').trim() || 'دوري الحريف';
    var clabel = (document.getElementById('class-label-input').value || '').trim();
    setupError = '';
    var id = genId();
    var data = createTournament(names, tname, clabel);
    data.id = id;
    try{ localStorage.setItem(tournamentKey(id), JSON.stringify(data)); }catch(e){}
    var idx = loadIndex();
    idx.push({id:id, tournamentName:tname, classLabel:clabel, createdAt:data.createdAt});
    saveIndex(idx);
    state = data; currentId = id; view = 'tournament';
    render();
  }

  /* ---------------- render: tournament ---------------- */
  function renderTournament(){
    var wrap = document.createElement('div');
    wrap.className = 'tournament-screen';
    wrap.appendChild(renderTopbar());
    var champ = champion();
    if(champ) wrap.appendChild(renderChampionBanner(champ));
    wrap.appendChild(renderBracket());
    app.appendChild(wrap);
    if(openMatchRef) app.appendChild(renderMatchPanel(openMatchRef.r, openMatchRef.m));
    requestAnimationFrame(drawConnectors);
  }

  function renderTopbar(){
    var bar = document.createElement('div');
    bar.className = 'topbar';
    var actionsHtml = confirmingReset
      ? '<span class="confirm-text">هيتم حذف البطولة دي نهائي.</span>' +
        '<button id="confirm-reset-yes" class="btn btn-danger btn-sm">تأكيد الحذف</button>' +
        '<button id="confirm-reset-no" class="btn btn-ghost btn-sm">إلغاء</button>'
      : '<button id="home-btn" class="btn btn-ghost btn-sm">🏠 كل البطولات</button>' +
        '<button id="print-btn" class="btn btn-ghost btn-sm">🖨️ طباعة</button>' +
        '<button id="delete-tournament-btn" class="btn btn-ghost btn-sm">🗑️ حذف البطولة</button>';
    bar.innerHTML =
      '<div class="topbar-title"><span class="topbar-badge">🧪</span><div>' +
        '<h1>'+escapeHtml(state.tournamentName)+'</h1>' +
        (state.classLabel ? '<span class="topbar-sub">'+escapeHtml(state.classLabel)+'</span>' : '') +
        '<span class="topbar-teacher">'+escapeHtml(TEACHER_NAME)+'</span>' +
      '</div></div>' +
      '<div class="topbar-actions">'+actionsHtml+'</div>';
    return bar;
  }

  function renderChampionBanner(name){
    var div = document.createElement('div');
    div.className = 'champion-banner';
    var dots = '';
    for(var i=0;i<14;i++) dots += '<span style="--i:'+i+'"></span>';
    div.innerHTML =
      '<div class="confetti" aria-hidden="true">'+dots+'</div>' +
      '<div class="champion-trophy">🏆</div>' +
      '<div class="champion-text"><span>بطل '+escapeHtml(state.tournamentName)+'</span><strong>'+escapeHtml(name)+'</strong></div>';
    return div;
  }

  function playerRow(p, score, showScore, isWinner, isLoser){
    var cls = ['player-row'];
    if(isWinner) cls.push('is-winner');
    if(isLoser) cls.push('is-loser');
    if(!p) cls.push('is-placeholder');
    var name = p ? escapeHtml(p.name) : 'في انتظار الفائز';
    return '<div class="'+cls.join(' ')+'">' +
      '<span class="player-name">'+name+'</span>' +
      (showScore ? '<span class="player-score">'+score+'</span>' : '') +
      (isWinner ? '<span class="winner-mark">🏅</span>' : '') +
      '</div>';
  }

  function renderMatchCardHtml(match, r, m){
    if(match.bye){
      var bp = match.p1 || match.p2;
      return '<div class="match is-bye" data-r="'+r+'" data-m="'+m+'">' +
        '<div class="player-row is-winner"><span class="player-name">'+escapeHtml(bp.name)+'</span><span class="winner-mark">🏅</span></div>' +
        '<div class="match-footer">راحة تلقائية ⏭️ — تأهل مباشر</div>' +
        '</div>';
    }
    var statusClass = match.winner ? 'is-done' : (match.p1 && match.p2 ? 'is-ready' : 'is-pending');
    var footer = '';
    if(match.winner) footer = '<div class="match-footer"><span class="undo-link">تراجع عن النتيجة ↺</span></div>';
    else if(statusClass==='is-ready') footer = '<div class="match-footer match-cta">اضغط لتسجيل النتيجة</div>';
    return '<div class="match '+statusClass+'" data-r="'+r+'" data-m="'+m+'">' +
      playerRow(match.p1, match.score1, !!match.winner, match.winner==='p1', match.winner==='p2') +
      '<div class="vs-divider"></div>' +
      playerRow(match.p2, match.score2, !!match.winner, match.winner==='p2', match.winner==='p1') +
      footer +
      '</div>';
  }

  function renderBracket(){
    var scrollWrap = document.createElement('div');
    scrollWrap.className = 'bracket-scroll';
    var dateEl = document.createElement('div');
    dateEl.className = 'print-date';
    dateEl.textContent = 'تاريخ الطباعة: ' + new Date().toLocaleDateString('ar-EG') + ' — لو الجدول مقطوع في الطباعة، فعّل خيار "Fit to page" في نافذة الطباعة.';
    scrollWrap.appendChild(dateEl);

    var bracket = document.createElement('div');
    bracket.className = 'bracket';
    var svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.setAttribute('class','bracket-svg');
    bracket.appendChild(svg);

    state.rounds.forEach(function(round, r){
      var col = document.createElement('div');
      col.className = 'round';
      var label = document.createElement('div');
      label.className = 'round-label';
      label.textContent = roundLabel(round.length);
      col.appendChild(label);
      var matchesWrap = document.createElement('div');
      matchesWrap.className = 'round-matches';
      var html = '';
      round.forEach(function(match, m){ html += renderMatchCardHtml(match, r, m); });
      matchesWrap.innerHTML = html;
      col.appendChild(matchesWrap);
      bracket.appendChild(col);
    });

    scrollWrap.appendChild(bracket);
    var hint = document.createElement('div');
    hint.className = 'scroll-hint';
    hint.textContent = '⇠ مرّر يمين وشمال عشان تشوف باقي الأدوار ⇢';
    scrollWrap.appendChild(hint);
    return scrollWrap;
  }

  function drawConnectors(){
    var bracket = document.querySelector('.bracket');
    var svg = document.querySelector('.bracket-svg');
    if(!bracket || !svg || !state) return;
    var bRect = bracket.getBoundingClientRect();
    svg.setAttribute('width', bracket.scrollWidth);
    svg.setAttribute('height', bracket.scrollHeight);
    svg.innerHTML = '';
    var ns = 'http://www.w3.org/2000/svg';
    for(var r=0; r<state.rounds.length-1; r++){
      state.rounds[r].forEach(function(match, m){
        var fromEl = bracket.querySelector('.match[data-r="'+r+'"][data-m="'+m+'"]');
        var nextIdx = Math.floor(m/2);
        var toEl = bracket.querySelector('.match[data-r="'+(r+1)+'"][data-m="'+nextIdx+'"]');
        if(!fromEl || !toEl) return;
        var fRect = fromEl.getBoundingClientRect();
        var tRect = toEl.getBoundingClientRect();
        var x1 = fRect.left - bRect.left;
        var y1 = fRect.top - bRect.top + fRect.height/2;
        var x2 = tRect.right - bRect.left;
        var y2 = tRect.top - bRect.top + tRect.height/2;
        var midX = (x1+x2)/2;
        var path = document.createElementNS(ns,'path');
        path.setAttribute('d', 'M '+x1+' '+y1+' H '+midX+' V '+y2+' H '+x2);
        path.setAttribute('class', (match.winner || match.bye) ? 'conn conn-done' : 'conn');
        svg.appendChild(path);
      });
    }
  }

  /* ---------------- render: scoring panel ---------------- */
  function renderMatchPanel(r,m){
    var match = state.rounds[r][m];
    var overlay = document.createElement('div');
    overlay.className = 'panel-overlay';
    var bothZero = match.score1===0 && match.score2===0;
    var tied = match.score1===match.score2;
    var statusHtml;
    if(bothZero) statusHtml = '🎯 يلا ابدأ بالسؤال الأول!';
    else if(tied) statusHtml = '⚖️ تعادل!';
    else statusHtml = '🔥 ' + escapeHtml(match.score1>match.score2 ? match.p1.name : match.p2.name) + ' متقدم';

    var bottomHtml;
    if(tied && !bothZero){
      bottomHtml =
        '<div class="tie-break">' +
          '<div class="tie-break-label">⚡ زي ركلات الترجيح بالظبط — اسأل سؤال فاصل واختار الفائز:</div>' +
          '<button class="tie-break-btn" data-side="p1">فوز '+escapeHtml(match.p1.name)+'</button>' +
          '<button class="tie-break-btn" data-side="p2">فوز '+escapeHtml(match.p2.name)+'</button>' +
        '</div>';
    } else {
      bottomHtml = '<button id="finish-match-btn" class="btn btn-primary btn-block"'+(tied?' disabled style="opacity:.4;cursor:not-allowed;"':'')+'>إنهاء المباراة ✅</button>';
    }

    overlay.innerHTML =
      '<div class="panel">' +
        '<button id="panel-close" class="panel-close" aria-label="إغلاق">✕</button>' +
        '<div class="panel-title">سجّل نتيجة المباراة</div>' +
        '<div class="panel-players">' +
          '<div class="panel-player">' +
            '<div class="panel-player-name">'+escapeHtml(match.p1.name)+'</div>' +
            '<div class="panel-score">'+match.score1+'</div>' +
            '<button class="score-plus" data-side="p1">إجابة صحيحة +1</button>' +
            '<span class="score-minus" data-side="p1">تراجع عن نقطة −1</span>' +
          '</div>' +
          '<div class="panel-player">' +
            '<div class="panel-player-name">'+escapeHtml(match.p2.name)+'</div>' +
            '<div class="panel-score">'+match.score2+'</div>' +
            '<button class="score-plus" data-side="p2">إجابة صحيحة +1</button>' +
            '<span class="score-minus" data-side="p2">تراجع عن نقطة −1</span>' +
          '</div>' +
        '</div>' +
        '<div class="panel-status">'+statusHtml+'</div>' +
        bottomHtml +
      '</div>';
    return overlay;
  }

  function openMatch(r,m){ openMatchRef = {r:r,m:m}; render(); }
  function closeMatchPanel(){ openMatchRef = null; render(); }
  function adjustScore(side, delta){
    if(!openMatchRef) return;
    var match = state.rounds[openMatchRef.r][openMatchRef.m];
    if(side==='p1') match.score1 = Math.max(0, match.score1+delta);
    else match.score2 = Math.max(0, match.score2+delta);
    saveState(); render();
  }
  function finishCurrentMatch(){
    if(!openMatchRef) return;
    var r=openMatchRef.r, m=openMatchRef.m;
    var match = state.rounds[r][m];
    if(match.score1===match.score2) return;
    var winnerKey = match.score1>match.score2 ? 'p1':'p2';
    finishMatch(r,m,winnerKey);
    openMatchRef = null;
    saveState(); render();
  }
  function finishMatchDirect(side){
    if(!openMatchRef) return;
    finishMatch(openMatchRef.r, openMatchRef.m, side);
    openMatchRef = null;
    saveState(); render();
  }

  /* ---------------- events (delegated, attached once) ---------------- */
  app.addEventListener('click', function(e){
    var undo = e.target.closest('.undo-link');
    if(undo){
      var card = undo.closest('.match');
      undoMatch(+card.dataset.r, +card.dataset.m);
      saveState(); render();
      return;
    }

    var startBtn = e.target.closest('#start-tournament-btn');
    if(startBtn){ handleStartTournament(); return; }

    var newDashBtn = e.target.closest('#new-tournament-dash-btn');
    if(newDashBtn){ goToSetup(); return; }

    var backDashBtn = e.target.closest('#back-to-dashboard-btn');
    if(backDashBtn){ goToDashboard(); return; }

    var homeBtn = e.target.closest('#home-btn');
    if(homeBtn){ goToDashboard(); return; }

    var printBtn = e.target.closest('#print-btn');
    if(printBtn){ window.print(); return; }

    var delTournBtn = e.target.closest('#delete-tournament-btn');
    if(delTournBtn){ confirmingReset = true; render(); return; }

    var confirmYes = e.target.closest('#confirm-reset-yes');
    if(confirmYes){ deleteTournamentById(currentId); return; }

    var confirmNo = e.target.closest('#confirm-reset-no');
    if(confirmNo){ confirmingReset = false; render(); return; }

    var tcOpen = e.target.closest('.tc-open');
    if(tcOpen){ openTournament(tcOpen.dataset.id); return; }

    var tcDelete = e.target.closest('.tc-delete');
    if(tcDelete){ confirmingDeleteId = tcDelete.dataset.id; render(); return; }

    var tcDeleteYes = e.target.closest('.tc-delete-yes');
    if(tcDeleteYes){ deleteTournamentById(tcDeleteYes.dataset.id); return; }

    var tcDeleteNo = e.target.closest('.tc-delete-no');
    if(tcDeleteNo){ confirmingDeleteId = null; render(); return; }

    var closeBtn = e.target.closest('#panel-close');
    if(closeBtn){ closeMatchPanel(); return; }

    if(e.target.classList && e.target.classList.contains('panel-overlay')){ closeMatchPanel(); return; }

    var plus = e.target.closest('.score-plus');
    if(plus){ adjustScore(plus.dataset.side, 1); return; }

    var minus = e.target.closest('.score-minus');
    if(minus){ adjustScore(minus.dataset.side, -1); return; }

    var finishBtn = e.target.closest('#finish-match-btn');
    if(finishBtn && !finishBtn.disabled){ finishCurrentMatch(); return; }

    var tieBtn = e.target.closest('.tie-break-btn');
    if(tieBtn){ finishMatchDirect(tieBtn.dataset.side); return; }

    var matchCard = e.target.closest('.match');
    if(matchCard && matchCard.classList.contains('is-ready')){
      openMatch(+matchCard.dataset.r, +matchCard.dataset.m);
      return;
    }
  });

  app.addEventListener('input', function(e){
    if(e.target.id==='names-textarea'){ draftNames = e.target.value; updateSetupPreview(); }
    else if(e.target.id==='tournament-name-input'){ draftTournamentName = e.target.value; }
    else if(e.target.id==='class-label-input'){ draftClassLabel = e.target.value; }
  });

  var resizeTimer;
  window.addEventListener('resize', function(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function(){
      if(document.querySelector('.bracket-svg')) drawConnectors();
    }, 150);
  });

  /* ---------------- init ---------------- */
  migrateLegacyIfNeeded();
  render();
  if(document.fonts && document.fonts.ready){
    document.fonts.ready.then(function(){ requestAnimationFrame(drawConnectors); });
  }

  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){ /* offline-only fallback, ignore */ });
    });
  }
})();
</script>
</body>
</html>
